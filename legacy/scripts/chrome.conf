# neko viewer chrome.conf — W1 viewer service (canonical, repo-mirrored).
#
# Injected into the neko container at /etc/neko/supervisord/google-chrome.conf
# (mounted :ro from the scripts volume, docker cp from this repo mirror).
# Adds CDP flags so the agent drives the SAME browser the viewer streams.
#
# ⚠️ W1 spike finding (2026-08-17): Chrome 151 AND 133 (Debian google-chrome
#    stable in neko latest / 2.9.0) are BROKEN for CDP agent driving:
#    Target.attachToTarget sessions die with -32001 "Session with given id not
#    found" and page-level ws hangs — even with fresh profiles, headless,
#    --disable-extensions, exact zenika flag parity. Chrome 124 (zenika/alpine-
#    chrome) verified working end-to-end (page-ws + browser-level attach).
#    FIX: pin Chrome for Testing 124.0.6367.78, downloaded into the profile
#    volume at /home/neko/.config/google-chrome-w1/cft-chrome/ (survives
#    container recreation; volume persists). Version is a config knob: swap
#    the binary + this command to upgrade, re-verify CDP before shipping.
#
# ⚠️ Chrome refuses CDP with the DEFAULT user-data-dir:
#    "DevTools remote debugging requires a non-default data directory"
#    → custom dir (google-chrome-w1), persistent via the viewer-profiles
#    volume.
# ⚠️ --remote-debugging-address=0.0.0.0 is IGNORED by Chrome 151/133 (binds
#    loopback) — agent attach runs in-container (docker exec). Browser-level
#    ws (/devtools/browser/<id>) responds; page-level ws hangs on 133+.
#    W2 hardening item: in-container socat relay.
# ⚠️ Stale profile locks after container RECREATE: an abrupt kill leaves
#    Singleton{Lock,Socket,Cookie} in the user-data-dir root; the new
#    container's hostname differs, so chrome reads the lock as owned by
#    "another computer" and exits (supervisor → FATAL, "profile in use").
#    The wrapper clears the locks before exec (verified 2026-08-17).
# ⚠️ FR-2 tabs-survive (2026-08-17): Chrome's default startup policy is
#    "open the start page" → open tabs lost on every restart/recreate even
#    though the profile volume persists. The wrapper patches Preferences
#    BEFORE exec: session.restore_on_startup=1 ("continue where you left
#    off") — idempotent, self-heals every launch. STATUS: CfT 124 in this
#    setup does NOT write a restorable snapshot at shutdown (no Last
#    Session / exit_type even on graceful Browser.close; chrome://restore
#    empty) → tabs still not restored. W2: test stopwaitsecs=30 (SIGKILL
#    before session-save is prime suspect), or agent-managed tab snapshot.
#
# 🚀 ENGINE BUMP 2026-08-17: CfT 124 → CfT 128.0.6613.137 (cft-chrome-128).
#    NOTE: the FR-4 blocker was NOT the Chrome version — it was the
#    cdp-relay's upstream idle timeout (create_connection(timeout=10) →
#    socket.timeout killed every long-lived CDP connection ~10s after
#    open; fixed via settimeout(None) in cdp-relay.py v2). The bump is
#    retained as a modernization only (newer engine, verified working
#    end-to-end with browser-use + window-manager). 124 remains at
#    ./cft-chrome/ as fallback.
#
# 🚨 INCIDENT 2026-08-17 evening (post-migration): watchtower updated
#    ghcr.io/m1k1o/neko/google-chrome:2.9.0 to a build shipping Debian
#    Chrome 133 → viewer chrome FATAL at startup (web_app.WebAppProto
#    NOTREACHED) against the migrated profile; CDP broken regardless.
#    Fixes: (1) this conf — CfT 128 pinned + Singleton wrapper +
#    startretries=5 (was 0: a single quick crash went FATAL forever);
#    (2) compose ulimits nofile 524288 on viewer+browser (soft was 1024
#    → EMFILE inotify_init with the 1.2 GB profile); (3) migrated
#    Default/ profile rebuilt fresh + persistence data restored.
#    Mirror discipline: the volume copy had DRIFTED from this file
#    (/usr/bin/google-chrome, no wrapper, startretries=0) — re-copied
#    2026-08-17 from the repo.
#
# CDP wiring rules learned (2026-08-17):
#  - Chrome allows ONE active browser-level ws per browser; a new
#    connection kicks the previous one (browser-use reconnect loops).
#  - browser-use connects via cdp_url = /json/version webSocketDebuggerUrl;
#    fresh Chrome state required (stale sessions after a kick freeze it).
#  - window-manager's brief polls (<1s) coexist fine with a long-lived
#    browser-use session since the relay fix.
[program:google-chrome]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/etc/neko/supervisord/prepare-chrome.sh
autostart=true
autorestart=true
startretries=5
startsecs=5
# D5 tab persistence (2026-08-17): 30 s graceful-stop window so Chrome
# flushes the session snapshot + session cookies (10 s was too short —
# supervisord SIGKILLed Chrome mid-flush → W1 restarts lost tabs AND SSO
# logins). Restore side: --restore-last-session in prepare-chrome.sh.
stopwaitsecs=30
stdout_logfile=/var/log/neko/google-chrome.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
