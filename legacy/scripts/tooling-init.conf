[program:tooling-init]
command=/bin/bash /etc/neko/supervisord/tooling-init.sh
autostart=true
autorestart=false
startsecs=0
priority=0
stdout_logfile=/var/log/neko/tooling-init.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/neko/tooling-init.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
