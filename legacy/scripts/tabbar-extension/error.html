<!doctype html>
<!-- Cloudbrowser Tab Bar — O6 error page (v1.12.0, spec O6 2026-08-22).
     chrome-error:// pages cannot run content scripts, so on a failed
     main-frame navigation the background worker replaces the tab with
     THIS page: the failure details + Retry/Back/Home + a functional
     tab bar (same message protocol as content.js). The bar keeps the
     tab pills, switch/close, relaunch, back/forward/reload and Home —
     the restart affordance is always reachable, exactly when Chrome
     broke. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page couldn't be loaded — Cloudbrowser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #16161a; color: #e8e8ea;
    font-family: system-ui, sans-serif; font-size: 14px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 24px 60px;
  }
  #card {
    max-width: 640px; width: 100%;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px; padding: 28px 32px; text-align: center;
  }
  #icon { font-size: 40px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 19px; font-weight: 600; margin-bottom: 10px; }
  #errUrl {
    font-size: 13px; color: #9aa0a6; word-break: break-all;
    background: rgba(0,0,0,.25); border-radius: 6px; padding: 8px 10px;
    margin-bottom: 8px;
  }
  #errCode { font-size: 12px; color: #b06a6a; margin-bottom: 20px; }
  #actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button {
    background: rgba(255,255,255,.09); color: #e8e8ea; border: 0;
    border-radius: 5px; padding: 7px 14px; font-size: 13px;
    font-family: inherit; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.16); }
  button.primary { background: #2f6fed; color: #fff; }
  button.primary:hover { background: #3d7bf5; }
  /* Bottom tab bar — same look as the content-script bar (#bar tokens) */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 26px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(17,17,19,.92); color: #e8e8ea; font-size: 12px;
    padding: 0 8px; user-select: none; cursor: default; white-space: nowrap;
    border-top: 1px solid rgba(255,255,255,.08); z-index: 2147483647;
  }
  #bar .btn {
    background: transparent; color: #e8e8ea; border: 0; border-radius: 5px;
    padding: 2px 7px; font-size: 13px; line-height: 20px; cursor: pointer;
    font-family: inherit;
  }
  #bar .btn:hover { background: rgba(255,255,255,.12); }
  #tabs { display: flex; align-items: center; gap: 5px; overflow: hidden; flex: 1; }
  #tabs .tab {
    display: inline-flex; align-items: center; gap: 5px; max-width: 170px;
    background: rgba(255,255,255,.06); border-radius: 4px;
    padding: 1px 4px 1px 8px; font-size: 12px; color: #cfd0d4;
    cursor: pointer; overflow: hidden;
  }
  #tabs .tab.active { background: rgba(255,255,255,.16); color: #fff; }
  #tabs .tab span.t { overflow: hidden; text-overflow: ellipsis; }
  #tabs .tab .close {
    background: transparent; border: 0; color: #9aa0a6; font-size: 13px;
    line-height: 1; padding: 1px 4px; cursor: pointer; border-radius: 3px;
  }
  #tabs .tab .close:hover { background: rgba(255,255,255,.15); color: #fff; }
</style>
</head>
<body>
  <div id="card">
    <div id="icon">⚠</div>
    <h1>This page couldn't be loaded</h1>
    <div id="errUrl"></div>
    <div id="errCode"></div>
    <div id="actions">
      <button id="retry" class="primary">↻ Retry</button>
      <button id="back">← Back</button>
      <button id="home">⌂ Home</button>
    </div>
  </div>
  <div id="bar">
    <button id="bRelaunch" class="btn" title="Relaunch Chrome">⏻</button>
    <button id="bBack" class="btn" title="Back">←</button>
    <button id="bFwd" class="btn" title="Forward">→</button>
    <button id="bReload" class="btn" title="Reload active tab">↺</button>
    <button id="bHome" class="btn" title="Home">⌂</button>
    <div id="tabs"></div>
  </div>
  <script src="error.js"></script>
</body>
</html>
