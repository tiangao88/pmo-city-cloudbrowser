# W1/W2 reference viewer: install mandatory embedded-Chrome policy at every
# container start. Both official Chrome policy roots are populated so swapping
# the CfT binary cannot bypass PMO City controls. The ready marker gates Chrome.
[program:policy-init]
command=sh -c 'set -eu; READY=/tmp/pmo-city-chrome-policy.ready; rm -f "$READY"; test -r /etc/neko/supervisord/chrome-customize.py; python3 /etc/neko/supervisord/chrome-customize.py install-policy /etc/opt/chrome/policies/managed /etc/opt/chrome_for_testing/policies/managed; touch "$READY"; chmod 644 "$READY"; echo policy-init-ok'
priority=1
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/neko/policy-init.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
