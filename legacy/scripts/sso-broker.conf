# D15 sso-broker (2026-08-18, Phase A): watcher daemon — detects the kiosk
# Chrome tab on the tinyauth/IdP login redirect and performs the trusted
# fill+submit with Vaultwarden-sourced credentials (see 23-d15-sso.md).
# Kill-switch: SSO_BROKER_ENABLED=false stops the program at startup.
# Credentials file: /etc/neko/supervisord/sso-creds.b64 (0600, provisioned
# by the host-side refresher sso-creds-provision.sh, shredded after use).
[program:sso-broker]
command=/usr/bin/python3 /etc/neko/supervisord/sso-broker.py
environment=SSO_BROKER_ENABLED="true"
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
stdout_logfile=/var/log/neko/sso-broker.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
