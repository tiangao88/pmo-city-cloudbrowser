# W2 title-proxy (2026-08-18): neko front proxy — rewrites the browser tab
# title to "Cloudbrowser: <email>" (Remote-Email header from tinyauth
# forwardAuth), relays WebSocket signaling and passes cookies. Same pattern
# as cdp-relay/restart-api: python stdlib, autostart, autorestart.
# Port 8081 (neko is 8080). Domain route for cloudbrowser.dev01.pmo.city
# must point at 8081 (Coolify UI-managed: Domains tab).
[program:title-proxy]
command=/usr/bin/python3 /etc/neko/supervisord/title-proxy.py
environment=FILES_URL="https://cloudfiles-w1.dev01.pmo.city/",SECRETS_URL="https://secrets.pmo.city/"
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
stdout_logfile=/var/log/neko/title-proxy.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
