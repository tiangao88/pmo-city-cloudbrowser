# S7 fleet v2 slot chrome.conf (shared by slot-1 + slot-2, scripts volume).
#
# Replaces the image's stock google-chrome.conf (the scripts volume mounts
# over /etc/neko/supervisord, which is the supervisord include dir). The
# stock file also declared [program:openbox] — kept here verbatim.
#
# Slot profile isolation: each slot mounts its OWN persistent volume at
# /home/neko/.config, so the default profile dir is safe (no collision).
#
# 2026-08-20 real-case CDP (Tigo go): slots run Chrome for Testing 128
# (cft-chrome-128 seeded into each slot's profile volume) via the
# slot-prepare-chrome.sh wrapper — kiosk (CfT notice bar does not render in
# kiosk) + CDP 9222 + tabbar extension for humans. The cdp-relay program
# exposes 0.0.0.0:9223 -> 127.0.0.1:9222 for external agent access.
[program:google-chrome]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/bin/sh /etc/neko/supervisord/slot-prepare-chrome.sh
stopsignal=INT
stopwaitsecs=30
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/google-chrome.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:cdp-relay]
command=/usr/bin/python3 /etc/neko/supervisord/cdp-relay.py
autorestart=true
startsecs=1
stopasgroup=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
