; W1 window-manager — keeps every Chrome window pinned to the full virtual
; screen (neko Xvfb runs WITHOUT a window manager, so Chrome's
; --start-maximized is a no-op; this watcher enforces explicit bounds via
; CDP). Pure-stdlib script, no apt dependencies — survives recreates.
; WM_SCREEN must match NEKO_SCREEN (e.g. 1920x1080).
[program:window-manager]
command=/usr/bin/python3 /etc/neko/supervisord/window-manager.py
user=neko
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=5
environment=WM_SCREEN="%(ENV_NEKO_SCREEN)s"
stdout_logfile=/var/log/neko/window-manager.log
stderr_logfile=/var/log/neko/window-manager.log
