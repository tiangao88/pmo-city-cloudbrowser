# sso-broker — SLOT variant (spec 47 GH.4 GrantHub capture + D15 SSO fill).
# Runs INSIDE the fleet slot container (scripts volume → /etc/neko/supervisord).
# Watches the slot's Chrome (CDP 9222) for:
#   1. the vault tab (secrets.pmo.city) → captures the user key the moment
#      the vault unlocks and POSTs it to the router's GrantHub API
#      (internal http://router:8081/connect/grant, shared broker token,
#      Remote-Email = slot owner from /home/neko/Downloads/.slot-user.json);
#   2. an SSO redirect (auth.pmo.city / auth.aikumi.app) → fills Authentik
#      with provisioned creds when sso-creds.b64 is present (D15 Phase A).
# Same python-stdlib pattern as restart-api: autostart + autorestart.
# The broker token comes from the container env (CB_GRANTHUB_BROKER_TOKEN).
# Kill switch: SSO_BROKER_ENABLED=false.
[program:sso-broker]
command=/usr/bin/python3 /etc/neko/supervisord/sso-broker.py
environment=SLOT_USER_FILE="/home/neko/Downloads/.slot-user.json"
autorestart=true
startsecs=1
stopasgroup=true
stdout_logfile=/var/log/neko/sso-broker.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
