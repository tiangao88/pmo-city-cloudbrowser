# S7 fleet v2 slots: neutralize the neko image's baked Chrome extension lockdown.
#
# STOCK Chrome 133 reads /etc/opt/chrome/policies/managed/policies.json; the
# neko google-chrome image ships that file with "ExtensionInstallBlocklist":
# ["*"] (allowlist only uBlock/SponsorBlock) → the unpacked tabbar-extension
# is refused at startup ("The administrator disabled unpacked extensions").
# The W1 viewer never hit this because CfT 128 reads /etc/opt/chrome_for_testing/
# (the image's policies.json is invisible to it).
#
# This one-shot strips the three Extension* keys (keeping every other baked
# policy) before google-chrome starts. priority=2 < google-chrome (800).
# Idempotent; /etc is ephemeral in the container so it must run at each boot.
[program:slot-policy-init]
command=/bin/sh /etc/neko/supervisord/slot-policy-init.sh
priority=2
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/neko/slot-policy-init.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
