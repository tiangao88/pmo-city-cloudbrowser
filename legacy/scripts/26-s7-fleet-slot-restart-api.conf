# W2 restart-api — SLOT variant (deployed as restart-api.conf in the FLEET
# scripts volume; the VIEWER keeps scripts/restart-api.conf without env).
# D4: HTTP restart button + CDP watchdog for Chrome.
# Same pattern as cdp-relay: python stdlib, autostart, autorestart.
# Port 9230 (relay is 9223). Agent calls GET /health, POST /restart over
# pmoc-lan (<container-ip>:9230); not exposed via traefik.
# PROFILE_DIR points at the slot profile (/home/neko/.config/google-chrome)
# so the watchdog/tab-restore act on the slot's own chrome.
[program:restart-api]
command=/usr/bin/python3 /etc/neko/supervisord/restart-api.py
environment=PROFILE_DIR="/home/neko/.config/google-chrome"
autorestart=true
startsecs=1
stopasgroup=true
stdout_logfile=/var/log/neko/restart-api.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
