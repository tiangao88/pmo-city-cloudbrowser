# S7 fleet v2 slot chrome.conf (shared by slot-1 + slot-2, scripts volume).
#
# Replaces the image's stock google-chrome.conf (the scripts volume mounts
# over /etc/neko/supervisord, which is the supervisord include dir). The
# stock file also declared [program:openbox] — kept here verbatim.
#
# Slot profile isolation: each slot mounts its OWN persistent volume at
# /home/neko/.config, so the default profile dir is safe (no collision).
#
# 2026-08-19 scope B: stock Chrome (133) intentionally kept — the CfT 124
# pin was a W1 viewer-only CDP workaround (133 breaks Target.attachToTarget).
# CDP flags deliberately ABSENT here; per-slot CDP is a W2 item.
[program:google-chrome]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/google-chrome
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/google-chrome
  --no-first-run
  --start-maximized
  --bwsi
  --force-dark-mode
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --load-extension=/etc/neko/supervisord/tabbar-extension
  --disable-extensions-except=/etc/neko/supervisord/tabbar-extension
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/google-chrome.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
