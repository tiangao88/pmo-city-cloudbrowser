[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmo-city-cloudbrowser"
version = "0.1.0.dev1"
description = "Independent PMO City CloudBrowser runtime and credential-broker boundary"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudbrowser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
