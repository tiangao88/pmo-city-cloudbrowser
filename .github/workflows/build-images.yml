name: Build images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.2.0-dev*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/tiangao88/pmo-city-cloudbrowser

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: router
            dockerfile: services/router/Dockerfile
          - name: slot-supervisor
            dockerfile: services/slot-supervisor/Dockerfile
          - name: browser
            dockerfile: services/browser/Dockerfile
          - name: viewer
            dockerfile: services/viewer/Dockerfile
          - name: agent-control
            dockerfile: services/agent-control/Dockerfile
          - name: downloads
            dockerfile: services/downloads/Dockerfile
          - name: credential-broker
            dockerfile: services/credential-broker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
