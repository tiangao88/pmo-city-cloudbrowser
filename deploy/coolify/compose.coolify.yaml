# Deployed CloudBrowser dev staging compose (Coolify).
# Image-based variant of deploy/coolify/compose.yaml: Coolify API-created
# services cannot clone the private repo to satisfy `build:` contexts, so the
# deployed compose pins the published dev images instead.
#
# The qualified release includes the CloudFiles gateway in front of the
# internal downloads service. The public host is bound to cloudfiles by the
# existing Coolify service Domains configuration.
#
# Public host routing is managed by the existing cloudbrowser2 Coolify service
# Domains configuration. Do not add compose-level Traefik routers for these
# hosts: that would create duplicate routes.
name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}

# Public host: cloudfiles2.dev01.pmo.city is a Domains entry for cloudfiles.
# The internal downloads service remains reachable only inside the network on
# port 8083.

x-common: &common
  restart: unless-stopped
  environment:
    CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
    CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
  networks:
    - cloudbrowser

services:
  router:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/router@sha256:626ebd0c6fc77fdca0fc64b18d94fe360200d4ed3da34a4a77a7dce3754e5aa3
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8080
      # Fail-closed control plane: the router dispatches slot lifecycle
      # commands to private slot supervisors and authenticates downstream
      # with its trusted secret; refuse to boot without either.
      CB_ROUTER_SHARED_SECRET: ${CB_ROUTER_SHARED_SECRET:?CB_ROUTER_SHARED_SECRET is required}
      CB_SLOT_SUPERVISOR_URLS: ${CB_SLOT_SUPERVISOR_URLS:?CB_SLOT_SUPERVISOR_URLS is required}
      # Trust the Traefik/TinyAuth forward-auth identity headers
      # (remote-user/email/name/groups, copied by tinyauth-pmo@file) for the
      # authenticated edge. Must only be set behind the authenticated proxy;
      # unset keeps the bearer-token-only behavior.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:?CB_EDGE_AUTH is required for the deployed authenticated edge}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:?CB_IDENTITY_LINK_SHARED_SECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:?CB_OIDC_ISSUER is required}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:?CB_TINYAUTH_REALM is required}
    depends_on:
      identity-link:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - router-state:/data/state

  slot-supervisor:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/slot-supervisor@sha256:c7909c9b6295186e4a4690e498e4582d89bec0e06edbd0a7acbe6571b7d2cc85
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8081
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-unassigned}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_ROUTER_SHARED_SECRET: ${CB_ROUTER_SHARED_SECRET:?CB_ROUTER_SHARED_SECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - slot-state:/data/state

  browser:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/browser@sha256:b9406369d0ba660f785a24c6d0034719c382aa6be465a870a142a3b07d5ee7d4
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 9230
      CB_CHROME_HTTP_URL: http://127.0.0.1:9222
      CB_CHROME_HTTP_PORT: 9222
      CB_CHROME_EXECUTABLE: ${CB_CHROME_EXECUTABLE:-/usr/bin/chromium}
      CB_CHROME_EXTRA_ARGS: ${CB_CHROME_EXTRA_ARGS:---headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage}
      CB_PROFILE_DIR: /data/profile
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_BROWSER_DOWNLOAD_DIR: /data/downloads-browser
      CB_DOWNLOADS_INGEST_URL: http://cloudfiles:8086
      CB_DOWNLOADS_INGEST_SECRET: ${CB_DOWNLOADS_INGEST_SECRET:?CB_DOWNLOADS_INGEST_SECRET is required}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9230/browser/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - browser-profile:/data/profile
      - browser-downloads:/data/downloads-browser

  agent-control:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/agent-control@sha256:f630567ba8be5393fd44d9d28bc7132eb71f3df0b5f7a3f866553cf90ff1e466
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8090
      CB_BROWSER_API_URL: http://browser:9230
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:?CB_PRINCIPAL_ID is required}
      CB_BROWSER_ID: ${CB_BROWSER_ID:?CB_BROWSER_ID is required}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:?CB_BINDING_GENERATION is required}
      CB_AGENT_CONTROL_SHARED_SECRET: ${CB_AGENT_CONTROL_SHARED_SECRET:?CB_AGENT_CONTROL_SHARED_SECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8090"

  viewer:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/viewer@sha256:95fc903cb81fd3ddc1df1ee9ac2ae6f15c239ecfa7fea064803b6fe59ed93b3d
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8082
      CB_VIEWER_TOKEN_SECRET: ${CB_VIEWER_TOKEN_SECRET:?CB_VIEWER_TOKEN_SECRET is required}
      # Trust the Traefik/TinyAuth forward-auth identity headers
      # (remote-user/email/name/groups, copied by tinyauth-pmo@file) for the
      # public employee surface. Must only be set behind the authenticated
      # proxy; unset keeps the bearer-token-only behavior.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:?CB_EDGE_AUTH is required for the deployed authenticated edge}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:?CB_IDENTITY_LINK_SHARED_SECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:?CB_OIDC_ISSUER is required}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:?CB_TINYAUTH_REALM is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8082"
    # These labels document the TinyAuth app-key contract. Coolify's Domains
    # entry supplies the generated Traefik router and tinyauth-pmo@file gate.
    # Keep the app-key stable and distinct from the Coolify deployment UUID.
    labels:
      - tinyauth.apps.cloudbrowser2-viewer.oauth.groups=PMOC_Users
      - tinyauth.apps.cloudbrowser2-viewer.config.domain=cloudbrowser2.dev01.pmo.city
      - traefik.http.middlewares.tinyauth-pmo@file

  downloads:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/downloads@sha256:f6eba84ce3fe270bb4746c2bbf4472df30025c06b017f08a78c5da2547a92bad
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8083
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:?CB_PRINCIPAL_ID is required}
      CB_BROWSER_ID: ${CB_BROWSER_ID:?CB_BROWSER_ID is required}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:?CB_BINDING_GENERATION is required}
      CB_DOWNLOADS_SHARED_SECRET: ${CB_DOWNLOADS_SHARED_SECRET:?CB_DOWNLOADS_SHARED_SECRET is required}
      CB_DOWNLOADS_ROOT: /data/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - downloads:/data/downloads
    expose:
      - "8083"

  cloudfiles:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/cloudfiles@sha256:580eb3f77664d5d5f92e5d273c907d7a047e4357c6ba4c571151e8e03711ee2a
    labels:
      - tinyauth.apps.cloudbrowser2-cloudfiles.oauth.groups=PMOC_Users
      - tinyauth.apps.cloudbrowser2-cloudfiles.config.domain=cloudfiles2.dev01.pmo.city
      - traefik.http.middlewares.tinyauth-pmo@file
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8085
      CB_DOWNLOADS_BASE_URL: http://downloads:8083
      CB_DOWNLOADS_SHARED_SECRET: ${CB_DOWNLOADS_SHARED_SECRET:?CB_DOWNLOADS_SHARED_SECRET is required}
      # Translate the Traefik/TinyAuth forward-auth identity headers into the
      # validated gateway session. Must only be set behind the authenticated
      # proxy (tinyauth-pmo@file + PMOC_Users gate on this host); unset keeps
      # the gateway fail-closed for every protected route.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:?CB_EDGE_AUTH is required for the deployed authenticated edge}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:?CB_IDENTITY_LINK_SHARED_SECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:?CB_OIDC_ISSUER is required}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:?CB_TINYAUTH_REALM is required}
      CB_CLAMAV_HOST: clamav
      CB_DOWNLOADS_INGEST_SECRET: ${CB_DOWNLOADS_INGEST_SECRET:?CB_DOWNLOADS_INGEST_SECRET is required}
      CB_DOWNLOADS_INGEST_PORT: 8086
    depends_on:
      downloads:
        condition: service_started
      identity-link:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8085"
      - "8086"
    volumes:
      - downloads:/data/downloads:ro

  clamav:
    <<: *common
    image: clamav/clamav:1.4
    environment:
      CLAMAV_HOST: clamav
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  identity-link:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/identity-link@sha256:6dbc384b6d28687ef927c685983df22dc3624997e666ee3808d5466d2c82b916
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:?CB_IDENTITY_LINK_SHARED_SECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:?CB_OIDC_ISSUER is required}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:?CB_TINYAUTH_REALM is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - identity-link-state:/data

  credential-broker:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/credential-broker@sha256:fc59b3cd088599fd75faa75c2aa4420044dea76bd6c42060f26a7c65aac54d99
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8084
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - broker-state:/data/state

networks:
  cloudbrowser:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-network

volumes:
  router-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-router-state
  slot-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-slot-state
  browser-profile:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-browser-profile
  downloads:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-downloads
  browser-downloads:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-browser-downloads
  broker-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-broker-state
  identity-link-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-identity-link-state
  clamav-db:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-clamav-db
