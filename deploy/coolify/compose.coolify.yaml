# Deployed CloudBrowser dev staging compose (Coolify).
#
# Coolify provisioning contract (v5):
#   - Coolify magic env variables generate the eight service-to-service
#     secrets below (${SERVICE_PASSWORD_64_<IDENTIFIER>}). They cover secret
#     values only; they do not satisfy the required custody key or Vault URL.
#   - A fresh deployment still requires two non-Coolify inputs:
#       CB_BROKER_GRANT_KEK_HEX — 32-byte custody KEK, injected from the
#         operator's secret manager; never generated or committed here.
#       CB_VAULT_BASE_URL — the approved credential-source endpoint.
#     Set both in Coolify's service environment before parsing/deploying this
#     compose. Other CB_* values use deploy-safe dev01 defaults and may be
#     overridden in the UI.
#   - The magic env values are auto-created with random 64-character
#     alphanumeric values on first parse and remain stable across redeploys
#     (editable in the UI).
# Image-based variant of deploy/coolify/compose.yaml: Coolify API-created
# services cannot clone the private repo to satisfy `build:` contexts, so the
# deployed compose pins the published dev images instead.
#
# The qualified release includes the CloudFiles gateway in front of the
# internal downloads service. The public host is bound to cloudfiles by the
# existing Coolify service Domains configuration.
#
# Public host routing is managed by the existing cloudbrowser2 Coolify service
# Domains configuration. Do not add compose-level Traefik routers for these
# hosts: that would create duplicate routes.
name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}

# Public host: cloudfiles2.dev01.pmo.city is a Domains entry for cloudfiles.
# The internal downloads service remains reachable only inside the network on
# port 8083.

x-common: &common
  restart: unless-stopped
  environment:
    CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
    CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
  networks:
    - cloudbrowser

services:
  router:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/router@sha256:7733b1d84cc1959cb0d155cdffa938920dd44cf0e35deca5813e5400238b6f54
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8080
      # Fail-closed control plane: the router dispatches slot lifecycle
      # commands to private slot supervisors and authenticates downstream
      # with its trusted secret; refuse to boot without either.
      CB_ROUTER_SHARED_SECRET: ${SERVICE_PASSWORD_64_ROUTERSECRET:?SERVICE_PASSWORD_64_ROUTERSECRET is required}
      CB_SLOT_SUPERVISOR_URLS: ${CB_SLOT_SUPERVISOR_URLS:-slot-1=http://slot-supervisor:8081}
      # §3.1: trusted forwarding targets for agent page-actions; the router
      # relays only allowlisted operations to slots the caller owns.
      CB_AGENT_CONTROL_URLS: ${CB_AGENT_CONTROL_URLS:-slot-1=http://agent-control:8090}
      CB_AGENT_CONTROL_SHARED_SECRET: ${SERVICE_PASSWORD_64_AGENTCTRLSECRET:?SERVICE_PASSWORD_64_AGENTCTRLSECRET is required}
      CB_CREDENTIAL_BROKER_URL: ${CB_CREDENTIAL_BROKER_URL:-http://credential-broker:8084}
      CB_CREDENTIAL_CAPABILITY_SECRET: ${SERVICE_PASSWORD_64_CREDENTIALCAPSECRET:?SERVICE_PASSWORD_64_CREDENTIALCAPSECRET is required}
      CB_CREDENTIAL_BROKER_AUDIENCE: ${CB_CREDENTIAL_BROKER_AUDIENCE:-credential-broker}
      CB_CREDENTIAL_BROKER_TIMEOUT_S: ${CB_CREDENTIAL_BROKER_TIMEOUT_S:-25}
      CB_CREDENTIAL_CAPABILITY_TTL_S: ${CB_CREDENTIAL_CAPABILITY_TTL_S:-26}
      # Trust the Traefik/TinyAuth forward-auth identity headers
      # (remote-user/email/name/groups, copied by tinyauth-pmo@file) for the
      # authenticated edge. Must only be set behind the authenticated proxy;
      # unset keeps the bearer-token-only behavior.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:-traefik-forwardauth}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${SERVICE_PASSWORD_64_IDLINKSECRET:?SERVICE_PASSWORD_64_IDLINKSECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-https://auth.aikumi.app/application/o/pmoc-sso/}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-tinyauth-pmo}
    depends_on:
      identity-link:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - router-state:/data/state

  slot-supervisor:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/slot-supervisor@sha256:3c9738eaf1346ff030d0f16433e29a14ef8b386e349dd33a2fa1bd9ac70201ff
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8081
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-dev01}
      # Placeholder binding matches the boot-stopped browser; the router's
      # wake adopts the server-minted binding (browser-{slot_id}).
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-slot-1}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_ROUTER_SHARED_SECRET: ${SERVICE_PASSWORD_64_ROUTERSECRET:?SERVICE_PASSWORD_64_ROUTERSECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - slot-state:/data/state

  browser:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/browser@sha256:009dd8160bdbbc21f68123d87a94b33dd1b2cfc385bf891d12c8fcb302f83e58
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 9230
      CB_CHROME_HTTP_URL: http://127.0.0.1:9222
      CB_CHROME_HTTP_PORT: 9222
      CB_CHROME_EXECUTABLE: ${CB_CHROME_EXECUTABLE:-/usr/bin/chromium}
      CB_CHROME_EXTRA_ARGS: ${CB_CHROME_EXTRA_ARGS:---headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage}
      CB_PROFILE_DIR: /data/profile
      # Activation-driven slot: boot stopped under the placeholder binding
      # whose browser_id matches the router minting rule browser-{slot_id};
      # the supervisor adopts the server-minted binding on wake.
      CB_BROWSER_AUTOSTART: ${CB_BROWSER_AUTOSTART:-0}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-slot-1}
      # Supervisor binding pushes and broker→browser submission use distinct
      # one-way secrets; browser never receives caller→broker request auth.
      CB_ROUTER_SHARED_SECRET: ${SERVICE_PASSWORD_64_ROUTERSECRET:?SERVICE_PASSWORD_64_ROUTERSECRET is required}
      CB_BROKER_SUBMIT_SECRET: ${SERVICE_PASSWORD_64_BROKERSUBMIT:?SERVICE_PASSWORD_64_BROKERSUBMIT is required}
      # Keep exact-target Authentik policy byte-for-byte aligned with broker.
      CB_BROKER_ADAPTER: ${CB_BROKER_ADAPTER:-basic}
      CB_BROKER_SSO_ENTRY_URL: ${CB_BROKER_SSO_ENTRY_URL:-}
      CB_BROKER_SSO_IDP_ORIGINS: ${CB_BROKER_SSO_IDP_ORIGINS:-}
      CB_BROKER_SSO_CALLBACK_ORIGINS: ${CB_BROKER_SSO_CALLBACK_ORIGINS:-}
      CB_BROKER_SSO_APPLICATION_ORIGINS: ${CB_BROKER_SSO_APPLICATION_ORIGINS:-}
      CB_BROKER_SSO_SUCCESS_PATHS: ${CB_BROKER_SSO_SUCCESS_PATHS:-}
      CB_BROKER_SSO_ALLOWED_MFA: ${CB_BROKER_SSO_ALLOWED_MFA:-totp}
      CB_BROKER_SSO_IDENTITY_SELECTOR: ${CB_BROKER_SSO_IDENTITY_SELECTOR:-}
      CB_BROKER_SSO_IDENTITY_CLAIM: ${CB_BROKER_SSO_IDENTITY_CLAIM:-}
      CB_BROKER_SSO_STAGE_TIMEOUT_S: ${CB_BROKER_SSO_STAGE_TIMEOUT_S:-24}
      CB_BROWSER_DOWNLOAD_DIR: /data/downloads-browser
      CB_DOWNLOADS_INGEST_URL: http://cloudfiles:8086
      CB_DOWNLOADS_INGEST_SECRET: ${SERVICE_PASSWORD_64_INGESTSECRET:?SERVICE_PASSWORD_64_INGESTSECRET is required}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9230/browser/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - browser-profile:/data/profile
      - browser-downloads:/data/downloads-browser

  agent-control:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/agent-control@sha256:7d57e6ed5d514c5a6cc005925a7bebae725ee22da0e7119198d74e4cacae7227
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8090
      CB_BROWSER_API_URL: http://browser:9230
      # The lease rotates to the server-minted session binding via
      # POST /agent-control/lease; no static binding pin here.
      CB_AGENT_CONTROL_SHARED_SECRET: ${SERVICE_PASSWORD_64_AGENTCTRLSECRET:?SERVICE_PASSWORD_64_AGENTCTRLSECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8090"

  viewer:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/viewer@sha256:dbaa7bab3d2094f49a8a1f642d7f1d6309280590aaade1b301da95687fd96c33
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8082
      CB_VIEWER_TOKEN_SECRET: ${SERVICE_PASSWORD_64_VIEWERSECRET:?SERVICE_PASSWORD_64_VIEWERSECRET is required}
      # Trust the Traefik/TinyAuth forward-auth identity headers
      # (remote-user/email/name/groups, copied by tinyauth-pmo@file) for the
      # public employee surface. Must only be set behind the authenticated
      # proxy; unset keeps the bearer-token-only behavior.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:-traefik-forwardauth}
      CB_ROUTER_BASE_URL: http://router:8080
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${SERVICE_PASSWORD_64_IDLINKSECRET:?SERVICE_PASSWORD_64_IDLINKSECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-https://auth.aikumi.app/application/o/pmoc-sso/}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-tinyauth-pmo}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8082"
    # These labels document the TinyAuth app-key contract. Coolify's Domains
    # entry supplies the generated Traefik router and tinyauth-pmo@file gate.
    # Keep the app-key stable and distinct from the Coolify deployment UUID.
    labels:
      - tinyauth.apps.cloudbrowser2-viewer.oauth.groups=PMOC_Users
      - tinyauth.apps.cloudbrowser2-viewer.config.domain=cloudbrowser2.dev01.pmo.city
      - traefik.http.middlewares.tinyauth-pmo@file

  downloads:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/downloads@sha256:db6668d9a69eac9b8aaf21f8d9a147727971750463855e4fbc3ecb2e5a2e80d7
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8083
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-dev01}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-dev01}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-dev01-g1}
      CB_DOWNLOADS_SHARED_SECRET: ${SERVICE_PASSWORD_64_DLSECRET:?SERVICE_PASSWORD_64_DLSECRET is required}
      CB_DOWNLOADS_ROOT: /data/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - downloads:/data/downloads
    expose:
      - "8083"

  cloudfiles:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/cloudfiles@sha256:4ae6bef7677c667a148e1d1efaf13d3c6de93ba65fd54012a5b96b15ed90fd73
    labels:
      - tinyauth.apps.cloudbrowser2-cloudfiles.oauth.groups=PMOC_Users
      - tinyauth.apps.cloudbrowser2-cloudfiles.config.domain=cloudfiles2.dev01.pmo.city
      - traefik.http.middlewares.tinyauth-pmo@file
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8085
      CB_DOWNLOADS_BASE_URL: http://downloads:8083
      CB_DOWNLOADS_SHARED_SECRET: ${SERVICE_PASSWORD_64_DLSECRET:?SERVICE_PASSWORD_64_DLSECRET is required}
      # Translate the Traefik/TinyAuth forward-auth identity headers into the
      # validated gateway session. Must only be set behind the authenticated
      # proxy (tinyauth-pmo@file + PMOC_Users gate on this host); unset keeps
      # the gateway fail-closed for every protected route.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:-traefik-forwardauth}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${SERVICE_PASSWORD_64_IDLINKSECRET:?SERVICE_PASSWORD_64_IDLINKSECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-https://auth.aikumi.app/application/o/pmoc-sso/}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-tinyauth-pmo}
      CB_CLAMAV_HOST: clamav
      CB_DOWNLOADS_INGEST_SECRET: ${SERVICE_PASSWORD_64_INGESTSECRET:?SERVICE_PASSWORD_64_INGESTSECRET is required}
      CB_DOWNLOADS_INGEST_PORT: 8086
    depends_on:
      downloads:
        condition: service_started
      identity-link:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8085"
      - "8086"
    volumes:
      - downloads:/data/downloads:ro

  clamav:
    <<: *common
    image: clamav/clamav:1.4
    environment:
      CLAMAV_HOST: clamav
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  identity-link:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/identity-link@sha256:98242e935e77ed01689907afb80d4af67b1677570c71ec768b86be76f466d1d8
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${SERVICE_PASSWORD_64_IDLINKSECRET:?SERVICE_PASSWORD_64_IDLINKSECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-https://auth.aikumi.app/application/o/pmoc-sso/}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-tinyauth-pmo}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - identity-link-state:/data

  credential-broker:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/credential-broker@sha256:b28cb2a21c52fba013769b009b2c7501af99a3bcd7c64d875a28b1d40e92edd5
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:-0.2.0-dev1}
      CB_PORT: 8084
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-unassigned}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-slot-1}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_CREDENTIAL_CAPABILITY_SECRET: ${SERVICE_PASSWORD_64_CREDENTIALCAPSECRET:?SERVICE_PASSWORD_64_CREDENTIALCAPSECRET is required}
      CB_CREDENTIAL_BROKER_AUDIENCE: ${CB_CREDENTIAL_BROKER_AUDIENCE:-credential-broker}
      CB_CREDENTIAL_BROKER_TIMEOUT_S: ${CB_CREDENTIAL_BROKER_TIMEOUT_S:-25}
      CB_CREDENTIAL_CAPABILITY_TTL_S: ${CB_CREDENTIAL_CAPABILITY_TTL_S:-26}
      CB_BROKER_SUBMIT_SECRET: ${SERVICE_PASSWORD_64_BROKERSUBMIT:?SERVICE_PASSWORD_64_BROKERSUBMIT is required}
      CB_CREDENTIAL_NONCE_DB_PATH: /data/state/nonces.sqlite3
      CB_BROKER_IDEMPOTENCY_DB_PATH: /data/state/idempotency.sqlite3
      CB_BROKER_GRANT_DB_PATH: /data/state/grant-custody-v1.sqlite3
      CB_BROKER_GRANT_KEK_HEX: ${CB_BROKER_GRANT_KEK_HEX:?CB_BROKER_GRANT_KEK_HEX is required}
      CB_BROKER_ADAPTER: ${CB_BROKER_ADAPTER:-basic}
      CB_BROKER_SITE_ID: ${CB_BROKER_SITE_ID:-basic-local}
      CB_BROKER_ORIGIN: ${CB_BROKER_ORIGIN:-https://basic.local.invalid}
      CB_BROKER_SUCCESS_PATH: ${CB_BROKER_SUCCESS_PATH:-/authenticated}
      CB_BROKER_SSO_ENTRY_URL: ${CB_BROKER_SSO_ENTRY_URL:-}
      CB_BROKER_SSO_IDP_ORIGINS: ${CB_BROKER_SSO_IDP_ORIGINS:-}
      CB_BROKER_SSO_CALLBACK_ORIGINS: ${CB_BROKER_SSO_CALLBACK_ORIGINS:-}
      CB_BROKER_SSO_APPLICATION_ORIGINS: ${CB_BROKER_SSO_APPLICATION_ORIGINS:-}
      CB_BROKER_SSO_SUCCESS_PATHS: ${CB_BROKER_SSO_SUCCESS_PATHS:-}
      CB_BROKER_SSO_ALLOWED_MFA: ${CB_BROKER_SSO_ALLOWED_MFA:-totp}
      CB_BROKER_SSO_IDENTITY_SELECTOR: ${CB_BROKER_SSO_IDENTITY_SELECTOR:-}
      CB_BROKER_SSO_IDENTITY_CLAIM: ${CB_BROKER_SSO_IDENTITY_CLAIM:-}
      CB_BROKER_SSO_STAGE_TIMEOUT_S: ${CB_BROKER_SSO_STAGE_TIMEOUT_S:-24}
      CB_VAULT_BASE_URL: ${CB_VAULT_BASE_URL:?CB_VAULT_BASE_URL is required}
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - broker-state:/data/state

networks:
  cloudbrowser:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-network

volumes:
  router-state:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-router-state
  slot-state:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-slot-state
  browser-profile:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-browser-profile
  downloads:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-downloads
  browser-downloads:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-browser-downloads
  broker-state:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-broker-state
  identity-link-state:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-identity-link-state
  clamav-db:
    name: ${CB_INSTANCE_ID:-cloudbrowser2-dev-v01}-clamav-db
