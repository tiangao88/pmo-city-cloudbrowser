# Deployed CloudBrowser dev staging compose (Coolify).
# Image-based variant of deploy/coolify/compose.yaml: Coolify API-created
# services cannot clone the private repo to satisfy `build:` contexts, so the
# deployed compose pins the published dev images instead.
#
# Public host routing for the downloads service is handled outside this
# compose (see deploy/coolify/README.md): the standalone `cloudfiles2`
# application at `cloudfiles2.dev01.pmo.city` fronts the downloads service
# when step 19 wires the Traefik route.
name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}

# Public downloads host: cloudfiles2.dev01.pmo.city is routed by the
# standalone `cloudfiles2` Coolify application (see deploy/coolify/README.md).
# The Traefik route is added in step 19. The download service is reachable
# from inside the CloudBrowser network on port 8083 (expose below).

x-common: &common
  restart: unless-stopped
  environment:
    CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
    CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
  networks:
    - cloudbrowser

services:
  router:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/router@sha256:e8cc096b8c80e93fcc70a38611647bbbda3a0cd6d54b4318dc7ce900840f6f74
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - router-state:/data/state

  slot-supervisor:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/slot-supervisor@sha256:083790d05e6a7f23a75666c5f5627444192d7845a31fc6d781fc873bbf858caf
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8081
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-unassigned}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - slot-state:/data/state

  browser:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/browser@sha256:e97a1cc3e264436955c94d037d7116eb840f883662fcd703053908eddbc3bd18
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 9230
      CB_CHROME_HTTP_URL: http://127.0.0.1:9222
      CB_CHROME_HTTP_PORT: 9222
      CB_CHROME_EXECUTABLE: ${CB_CHROME_EXECUTABLE:-/usr/bin/chromium}
      CB_PROFILE_DIR: /data/profile
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9230/browser/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - browser-profile:/data/profile

  agent-control:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/agent-control@sha256:4118dd4768a23f7b350aa723b0a2d87f96924afd9e45a2a58c600ac97f06d52d
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8090
      CB_BROWSER_API_URL: http://browser:9230
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:?CB_PRINCIPAL_ID is required}
      CB_BROWSER_ID: ${CB_BROWSER_ID:?CB_BROWSER_ID is required}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:?CB_BINDING_GENERATION is required}
      CB_AGENT_CONTROL_SHARED_SECRET: ${CB_AGENT_CONTROL_SHARED_SECRET:?CB_AGENT_CONTROL_SHARED_SECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8090"

  viewer:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/viewer@sha256:399d5f428e773a043d9f23bd579651f9a27710ddaa318cd01978c166bb9e59fa
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8082
      CB_VIEWER_TOKEN_SECRET: ${CB_VIEWER_TOKEN_SECRET:?CB_VIEWER_TOKEN_SECRET is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8082"

  downloads:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/downloads@sha256:04516af52481aa4f616458a073d90548a7267f1df277eee45e94b2286651f201
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8083
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:?CB_PRINCIPAL_ID is required}
      CB_BROWSER_ID: ${CB_BROWSER_ID:?CB_BROWSER_ID is required}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:?CB_BINDING_GENERATION is required}
      CB_DOWNLOADS_SHARED_SECRET: ${CB_DOWNLOADS_SHARED_SECRET:?CB_DOWNLOADS_SHARED_SECRET is required}
      CB_DOWNLOADS_ROOT: /data/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - downloads:/data/downloads
    expose:
      - "8083"

  credential-broker:
    <<: *common
    image: ghcr.io/tiangao88/pmo-city-cloudbrowser/credential-broker@sha256:6b43206713d27c41a00a9a5228b15e57e1d99586805d5e1215a2dd38946745e9
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8084
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - broker-state:/data/state

networks:
  cloudbrowser:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-network

volumes:
  router-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-router-state
  slot-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-slot-state
  browser-profile:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-browser-profile
  downloads:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-downloads
  broker-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-broker-state
