name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}

# The internal downloads service is not the public CloudFiles product surface.
# CloudFiles is the authenticated public gateway; identity-link is its private
# PMO-owned identity authority.

x-common: &common
  restart: unless-stopped
  environment:
    CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
    CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
  networks:
    - cloudbrowser

services:
  router:
    <<: *common
    build:
      context: ../..
      dockerfile: services/router/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8080
      # Fail-closed control plane: the router dispatches slot lifecycle
      # commands to private slot supervisors and authenticates downstream
      # with its trusted secret; refuse to boot without either.
      CB_ROUTER_SHARED_SECRET: ${CB_ROUTER_SHARED_SECRET:?CB_ROUTER_SHARED_SECRET is required}
      CB_SLOT_SUPERVISOR_URLS: ${CB_SLOT_SUPERVISOR_URLS:?CB_SLOT_SUPERVISOR_URLS is required}
      # §3.1: trusted forwarding targets for agent page-actions; the router
      # relays only allowlisted operations to slots the caller owns.
      CB_AGENT_CONTROL_URLS: ${CB_AGENT_CONTROL_URLS:?CB_AGENT_CONTROL_URLS is required}
      CB_AGENT_CONTROL_SHARED_SECRET: ${CB_AGENT_CONTROL_SHARED_SECRET:?CB_AGENT_CONTROL_SHARED_SECRET is required}
      CB_CREDENTIAL_BROKER_URL: ${CB_CREDENTIAL_BROKER_URL:-http://credential-broker:8084}
      CB_CREDENTIAL_CAPABILITY_SECRET: ${CB_CREDENTIAL_CAPABILITY_SECRET:?CB_CREDENTIAL_CAPABILITY_SECRET is required}
      CB_CREDENTIAL_BROKER_AUDIENCE: ${CB_CREDENTIAL_BROKER_AUDIENCE:-credential-broker}
      CB_CREDENTIAL_BROKER_TIMEOUT_S: ${CB_CREDENTIAL_BROKER_TIMEOUT_S:-25}
      CB_CREDENTIAL_CAPABILITY_TTL_S: ${CB_CREDENTIAL_CAPABILITY_TTL_S:-26}
      # ONLY when running behind the authenticated proxy (deployed variant).
      # Unset here so local/CI runs keep the health-only posture.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:-}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:-}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-}
    depends_on:
      identity-link:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - router-state:/data/state

  slot-supervisor:
    <<: *common
    build:
      context: ../..
      dockerfile: services/slot-supervisor/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8081
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-unassigned}
      # Placeholder binding matches the boot-stopped browser; the router's
      # wake adopts the server-minted binding (browser-{slot_id}).
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-slot-1}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_ROUTER_SHARED_SECRET: ${CB_ROUTER_SHARED_SECRET:?CB_ROUTER_SHARED_SECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - slot-state:/data/state

  browser:
    <<: *common
    build:
      context: ../..
      dockerfile: services/browser/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 9230
      CB_CHROME_HTTP_URL: http://127.0.0.1:9222
      CB_CHROME_HTTP_PORT: 9222
      CB_CHROME_EXECUTABLE: ${CB_CHROME_EXECUTABLE:-/usr/bin/chromium}
      CB_PROFILE_DIR: /data/profile
      # Activation-driven slot: boot stopped under the placeholder binding
      # whose browser_id matches the router minting rule browser-{slot_id}.
      CB_BROWSER_AUTOSTART: ${CB_BROWSER_AUTOSTART:-0}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-slot-1}
      # Supervisor binding pushes and broker→browser submission use distinct
      # one-way secrets; browser never receives caller→broker request auth.
      CB_ROUTER_SHARED_SECRET: ${CB_ROUTER_SHARED_SECRET:?CB_ROUTER_SHARED_SECRET is required}
      CB_BROKER_SUBMIT_SECRET: ${CB_BROKER_SUBMIT_SECRET:?CB_BROKER_SUBMIT_SECRET is required}
      # Identical Authentik policy is injected into browser + broker. Both
      # runtimes fail closed when SSO is selected with any rule missing.
      CB_BROKER_ADAPTER: ${CB_BROKER_ADAPTER:-basic}
      CB_BROKER_SSO_ENTRY_URL: ${CB_BROKER_SSO_ENTRY_URL:-}
      CB_BROKER_SSO_IDP_ORIGINS: ${CB_BROKER_SSO_IDP_ORIGINS:-}
      CB_BROKER_SSO_CALLBACK_ORIGINS: ${CB_BROKER_SSO_CALLBACK_ORIGINS:-}
      CB_BROKER_SSO_APPLICATION_ORIGINS: ${CB_BROKER_SSO_APPLICATION_ORIGINS:-}
      CB_BROKER_SSO_SUCCESS_PATHS: ${CB_BROKER_SSO_SUCCESS_PATHS:-}
      CB_BROKER_SSO_ALLOWED_MFA: ${CB_BROKER_SSO_ALLOWED_MFA:-totp}
      CB_BROKER_SSO_IDENTITY_SELECTOR: ${CB_BROKER_SSO_IDENTITY_SELECTOR:-}
      CB_BROKER_SSO_IDENTITY_CLAIM: ${CB_BROKER_SSO_IDENTITY_CLAIM:-}
      CB_BROKER_SSO_STAGE_TIMEOUT_S: ${CB_BROKER_SSO_STAGE_TIMEOUT_S:-24}
      CB_BROWSER_DOWNLOAD_DIR: /data/downloads-browser
      CB_DOWNLOADS_INGEST_URL: http://cloudfiles:8086
      CB_DOWNLOADS_INGEST_SECRET: ${CB_DOWNLOADS_INGEST_SECRET:?CB_DOWNLOADS_INGEST_SECRET is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9230/browser/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - browser-profile:/data/profile
      - browser-downloads:/data/downloads-browser

  agent-control:
    <<: *common
    build:
      context: ../..
      dockerfile: services/agent-control/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8090
      CB_BROWSER_API_URL: http://browser:9230
      # The lease rotates to the server-minted session binding via
      # POST /agent-control/lease; no static binding pin here.
      CB_AGENT_CONTROL_SHARED_SECRET: ${CB_AGENT_CONTROL_SHARED_SECRET:?CB_AGENT_CONTROL_SHARED_SECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8090"

  viewer:
    <<: *common
    build:
      context: ../..
      dockerfile: services/viewer/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8082
      CB_VIEWER_TOKEN_SECRET: ${CB_VIEWER_TOKEN_SECRET:?CB_VIEWER_TOKEN_SECRET is required}
      # Opt into trusting the Traefik/TinyAuth forward-auth identity headers
      # ONLY when running behind the authenticated proxy (deployed variant).
      # Unset here so local/CI runs keep the bearer-token-only behavior.
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:-}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:-}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8082"

  downloads:
    <<: *common
    build:
      context: ../..
      dockerfile: services/downloads/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8083
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:?CB_PRINCIPAL_ID is required}
      CB_BROWSER_ID: ${CB_BROWSER_ID:?CB_BROWSER_ID is required}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:?CB_BINDING_GENERATION is required}
      CB_DOWNLOADS_SHARED_SECRET: ${CB_DOWNLOADS_SHARED_SECRET:?CB_DOWNLOADS_SHARED_SECRET is required}
      CB_DOWNLOADS_ROOT: /data/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - downloads:/data/downloads
    expose:
      - "8083"

  cloudfiles:
    <<: *common
    build:
      context: ../..
      dockerfile: services/cloudfiles/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8085
      CB_DOWNLOADS_BASE_URL: http://downloads:8083
      CB_DOWNLOADS_SHARED_SECRET: ${CB_DOWNLOADS_SHARED_SECRET:?CB_DOWNLOADS_SHARED_SECRET is required}
      CB_EDGE_AUTH: ${CB_EDGE_AUTH:-}
      CB_IDENTITY_LINK_BASE_URL: http://identity-link:8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:-}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:-}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:-}
      CB_CLAMAV_HOST: clamav
      CB_DOWNLOADS_INGEST_SECRET: ${CB_DOWNLOADS_INGEST_SECRET:?CB_DOWNLOADS_INGEST_SECRET is required}
      CB_DOWNLOADS_INGEST_PORT: 8086
    depends_on:
      downloads:
        condition: service_started
      identity-link:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8085"
      - "8086"
    volumes:
      - downloads:/data/downloads:ro

  clamav:
    <<: *common
    image: clamav/clamav:1.4
    environment:
      CLAMAV_HOST: clamav
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  identity-link:
    <<: *common
    build:
      context: ../..
      dockerfile: services/identity-link/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8091
      CB_IDENTITY_LINK_SHARED_SECRET: ${CB_IDENTITY_LINK_SHARED_SECRET:?CB_IDENTITY_LINK_SHARED_SECRET is required}
      CB_OIDC_ISSUER: ${CB_OIDC_ISSUER:?CB_OIDC_ISSUER is required}
      CB_TINYAUTH_REALM: ${CB_TINYAUTH_REALM:?CB_TINYAUTH_REALM is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - identity-link-state:/data

  credential-broker:
    <<: *common
    build:
      context: ../..
      dockerfile: services/credential-broker/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8084
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-unassigned}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-slot-1}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
      CB_CREDENTIAL_CAPABILITY_SECRET: ${CB_CREDENTIAL_CAPABILITY_SECRET:?CB_CREDENTIAL_CAPABILITY_SECRET is required}
      CB_CREDENTIAL_BROKER_AUDIENCE: ${CB_CREDENTIAL_BROKER_AUDIENCE:-credential-broker}
      CB_CREDENTIAL_BROKER_TIMEOUT_S: ${CB_CREDENTIAL_BROKER_TIMEOUT_S:-25}
      CB_CREDENTIAL_CAPABILITY_TTL_S: ${CB_CREDENTIAL_CAPABILITY_TTL_S:-26}
      CB_BROKER_SUBMIT_SECRET: ${CB_BROKER_SUBMIT_SECRET:?CB_BROKER_SUBMIT_SECRET is required}
      CB_CREDENTIAL_NONCE_DB_PATH: /data/state/nonces.sqlite3
      CB_BROKER_IDEMPOTENCY_DB_PATH: /data/state/idempotency.sqlite3
      CB_BROKER_GRANT_DB_PATH: /data/state/grant-custody-v1.sqlite3
      CB_BROKER_GRANT_KEK_HEX: ${CB_BROKER_GRANT_KEK_HEX:?CB_BROKER_GRANT_KEK_HEX is required}
      CB_BROKER_ADAPTER: ${CB_BROKER_ADAPTER:-basic}
      CB_BROKER_SITE_ID: ${CB_BROKER_SITE_ID:?CB_BROKER_SITE_ID is required}
      CB_BROKER_ORIGIN: ${CB_BROKER_ORIGIN:?CB_BROKER_ORIGIN is required}
      CB_BROKER_SUCCESS_PATH: ${CB_BROKER_SUCCESS_PATH:?CB_BROKER_SUCCESS_PATH is required}
      CB_BROKER_SSO_ENTRY_URL: ${CB_BROKER_SSO_ENTRY_URL:-}
      CB_BROKER_SSO_IDP_ORIGINS: ${CB_BROKER_SSO_IDP_ORIGINS:-}
      CB_BROKER_SSO_CALLBACK_ORIGINS: ${CB_BROKER_SSO_CALLBACK_ORIGINS:-}
      CB_BROKER_SSO_APPLICATION_ORIGINS: ${CB_BROKER_SSO_APPLICATION_ORIGINS:-}
      CB_BROKER_SSO_SUCCESS_PATHS: ${CB_BROKER_SSO_SUCCESS_PATHS:-}
      CB_BROKER_SSO_ALLOWED_MFA: ${CB_BROKER_SSO_ALLOWED_MFA:-totp}
      CB_BROKER_SSO_IDENTITY_SELECTOR: ${CB_BROKER_SSO_IDENTITY_SELECTOR:-}
      CB_BROKER_SSO_IDENTITY_CLAIM: ${CB_BROKER_SSO_IDENTITY_CLAIM:-}
      CB_BROKER_SSO_STAGE_TIMEOUT_S: ${CB_BROKER_SSO_STAGE_TIMEOUT_S:-24}
      CB_VAULT_BASE_URL: ${CB_VAULT_BASE_URL:?CB_VAULT_BASE_URL is required}
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - broker-state:/data/state
networks:
  cloudbrowser:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-network

volumes:
  router-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-router-state
  slot-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-slot-state
  browser-profile:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-browser-profile
  downloads:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-downloads
  browser-downloads:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-browser-downloads
  broker-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-broker-state
  identity-link-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-identity-link-state
  clamav-db:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-clamav-db
