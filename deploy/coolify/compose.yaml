name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}

x-common: &common
  restart: unless-stopped
  environment:
    CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
    CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
  networks:
    - cloudbrowser

services:
  router:
    <<: *common
    build:
      context: ../..
      dockerfile: services/router/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - router-state:/data/state

  slot-supervisor:
    <<: *common
    build:
      context: ../..
      dockerfile: services/slot-supervisor/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8081
      CB_BROWSER_API_URL: http://browser:9230
      CB_PROFILE_ID: ${CB_PROFILE_ID:-profile-unassigned}
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BROWSER_ID: ${CB_BROWSER_ID:-browser-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - slot-state:/data/state

  browser:
    <<: *common
    build:
      context: ../..
      dockerfile: services/browser/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 9230
      CB_CHROME_HTTP_URL: http://127.0.0.1:9222
      CB_CHROME_HTTP_PORT: 9222
      CB_CHROME_EXECUTABLE: ${CB_CHROME_EXECUTABLE:-/usr/bin/chromium}
      CB_PROFILE_DIR: /data/profile
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:-principal-unassigned}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:-generation-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9230/browser/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - browser-profile:/data/profile

  agent-control:
    <<: *common
    build:
      context: ../..
      dockerfile: services/agent-control/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8090
      CB_BROWSER_API_URL: http://browser:9230
      CB_PRINCIPAL_ID: ${CB_PRINCIPAL_ID:?CB_PRINCIPAL_ID is required}
      CB_BROWSER_ID: ${CB_BROWSER_ID:?CB_BROWSER_ID is required}
      CB_BINDING_GENERATION: ${CB_BINDING_GENERATION:?CB_BINDING_GENERATION is required}
      CB_AGENT_CONTROL_SHARED_SECRET: ${CB_AGENT_CONTROL_SHARED_SECRET:?CB_AGENT_CONTROL_SHARED_SECRET is required}
    depends_on:
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8090"

  viewer:
    <<: *common
    build:
      context: ../..
      dockerfile: services/viewer/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8082
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    expose:
      - "8082"

  downloads:
    <<: *common
    build:
      context: ../..
      dockerfile: services/downloads/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8083
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - downloads:/data/downloads

  credential-broker:
    <<: *common
    build:
      context: ../..
      dockerfile: services/credential-broker/Dockerfile
    environment:
      CB_INSTANCE_ID: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}
      CB_RELEASE_VERSION: ${CB_RELEASE_VERSION:?CB_RELEASE_VERSION is required}
      CB_PORT: 8084
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - broker-state:/data/state

networks:
  cloudbrowser:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-network

volumes:
  router-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-router-state
  slot-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-slot-state
  browser-profile:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-browser-profile
  downloads:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-downloads
  broker-state:
    name: ${CB_INSTANCE_ID:?CB_INSTANCE_ID is required}-broker-state
